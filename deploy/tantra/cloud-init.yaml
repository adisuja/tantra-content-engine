#cloud-config
# tantra: paste this into Oracle's "Initialization script" box when creating the VM.
# It installs Docker and Compose, and puts setup.sh in /opt/tantra. It holds no
# secrets: setup.sh asks for the tunnel token and generates everything else on the VM.
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - curl
  - openssl
runcmd:
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  - mkdir -p /opt/tantra
  # Works only while the repo is public. Private: scp deploy/tantra/setup.sh to the
  # VM and sudo install -m 700 it as /opt/tantra/setup.sh (no token in user data).
  - "curl -fsSL -H 'Accept: application/vnd.github.raw' 'https://api.github.com/repos/adisuja/tantra-content-engine/contents/deploy/tantra/setup.sh?ref=main' -o /opt/tantra/setup.sh || echo 'setup.sh not fetched (private repo), copy it by hand'"
  - test -f /opt/tantra/setup.sh && chmod 700 /opt/tantra/setup.sh || true
  - timedatectl set-timezone UTC
  - touch /opt/tantra/.cloud-init-done
